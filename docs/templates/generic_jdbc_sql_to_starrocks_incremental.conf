env {
  job.mode = "BATCH"
  parallelism = 1
}

source {
  Jdbc {
    plugin_output = "src"
    url = "${source_jdbc_url}"
    driver = "${source_jdbc_driver}"
    username = "${source_username}"
    password = "${source_password}"
    query = """
      /* task_code=${task_code}, run_id=${run_id}, batch_id=${batch_id} */
      ${source_query}
    """
  }
}

transform {
  Sql {
    plugin_input = "src"
    plugin_output = "valid_rows"
    query = """
      SELECT
        '${batch_id}' AS batch_id,
        id,
        biz_no,
        amount,
        update_time,
        '${run_id}' AS run_id,
        CURRENT_TIMESTAMP AS ingest_time
      FROM dual
      WHERE id IS NOT NULL
    """
  }

  Sql {
    plugin_input = "src"
    plugin_output = "error_rows"
    query = """
      SELECT
        '${batch_id}' AS batch_id,
        CONCAT('ERR_', CAST(CURRENT_TIMESTAMP AS STRING), '_', CAST(RAND() AS STRING)) AS error_id,
        CAST(id AS STRING) AS source_key,
        'VALIDATE_ERROR' AS error_type,
        CASE
          WHEN id IS NULL THEN 'ID_NULL'
          ELSE 'UNKNOWN_ERROR'
        END AS error_reason,
        CURRENT_TIMESTAMP AS created_time
      FROM dual
      WHERE id IS NULL
    """
  }
}

sink {
  StarRocks {
    plugin_input = "valid_rows"
    nodeUrls = [${starrocks_node_urls}]
    base-url = "${starrocks_base_url}"
    username = "${starrocks_username}"
    password = "${starrocks_password}"
    database = "${starrocks_database}"
    table = "${starrocks_table}"
    batch_max_rows = 5000
    starrocks.config = {
      format = "JSON"
      strip_outer_array = true
    }
  }

  StarRocks {
    plugin_input = "error_rows"
    nodeUrls = [${starrocks_node_urls}]
    base-url = "${starrocks_base_url}"
    username = "${starrocks_username}"
    password = "${starrocks_password}"
    database = "${starrocks_database}"
    table = "${starrocks_error_table}"
    batch_max_rows = 5000
    starrocks.config = {
      format = "JSON"
      strip_outer_array = true
    }
  }
}
