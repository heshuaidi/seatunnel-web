env {
  job.mode = "BATCH"
  parallelism = 1
}

source {
  Jdbc {
    plugin_output = "src_header"
    url = "${source_jdbc_url}"
    driver = "oracle.jdbc.OracleDriver"
    username = "${source_username}"
    password = "${source_password}"
    query = """
      SELECT
        CAST(ORDER_ID AS VARCHAR2(128)) AS meas_id,
        'ST_ORDER_HEADER' AS source_table,
        ORDER_NO AS lot_id,
        CAST(CUSTOMER_ID AS VARCHAR2(128)) AS wafer_id,
        'PRODUCT_A' AS product_id,
        'STEP_A' AS step_id,
        'TOOL_A' AS tool_id,
        'CHAMBER_A' AS chamber_id,
        'RECIPE_A' AS recipe_id,
        'CD' AS param_code,
        UPDATE_TIME AS measure_time,
        UPDATE_TIME AS update_time
      FROM ST_ORDER_HEADER
      WHERE UPDATE_TIME >= TO_TIMESTAMP('${batch_start_time}', 'YYYY-MM-DD HH24:MI:SS')
        AND UPDATE_TIME <  TO_TIMESTAMP('${batch_end_time}', 'YYYY-MM-DD HH24:MI:SS')
    """
  }

  Jdbc {
    plugin_output = "src_site"
    url = "${source_jdbc_url}"
    driver = "oracle.jdbc.OracleDriver"
    username = "${source_username}"
    password = "${source_password}"
    query = """
      SELECT
        CAST(ORDER_ID AS VARCHAR2(128)) AS meas_id,
        ITEM_ID AS site_no,
        0 AS die_x,
        0 AS die_y,
        0 AS site_x,
        0 AS site_y,
        AMOUNT AS value_num,
        0 AS spec_low,
        999999 AS spec_high,
        UPDATE_TIME AS update_time
      FROM ST_ORDER_ITEM
      WHERE UPDATE_TIME >= TO_TIMESTAMP('${batch_start_time}', 'YYYY-MM-DD HH24:MI:SS')
        AND UPDATE_TIME <  TO_TIMESTAMP('${batch_end_time}', 'YYYY-MM-DD HH24:MI:SS')
    """
  }
}

transform {
  Sql {
    plugin_input = "src_header"
    plugin_output = "valid_header"
    query = """
      SELECT
        '${batch_id}' AS batch_id,
        meas_id,
        '${source_system}' AS source_system,
        source_table,
        lot_id,
        wafer_id,
        product_id,
        step_id,
        tool_id,
        chamber_id,
        recipe_id,
        param_code,
        measure_time,
        update_time,
        CURRENT_TIMESTAMP AS ingest_time
      FROM src_header
      WHERE meas_id IS NOT NULL
        AND update_time IS NOT NULL
    """
  }

  Sql {
    plugin_input = "src_site"
    plugin_output = "valid_site"
    query = """
      SELECT
        '${batch_id}' AS batch_id,
        meas_id,
        site_no,
        die_x,
        die_y,
        site_x,
        site_y,
        value_num,
        spec_low,
        spec_high,
        CASE
          WHEN value_num IS NULL THEN false
          WHEN spec_low IS NOT NULL AND value_num < spec_low THEN true
          WHEN spec_high IS NOT NULL AND value_num > spec_high THEN true
          ELSE false
        END AS is_oos,
        update_time,
        CURRENT_TIMESTAMP AS ingest_time
      FROM src_site
      WHERE meas_id IS NOT NULL
        AND site_no IS NOT NULL
    """
  }
}

sink {
  StarRocks {
    plugin_input = "valid_header"
    nodeUrls = [${starrocks_node_urls}]
    base-url = "${starrocks_base_url}"
    username = "${starrocks_username}"
    password = "${starrocks_password}"
    database = "${starrocks_database}"
    table = "xchg_meas_header"
    batch_max_rows = 5000
    starrocks.config = {
      format = "JSON"
      strip_outer_array = true
    }
  }

  StarRocks {
    plugin_input = "valid_site"
    nodeUrls = [${starrocks_node_urls}]
    base-url = "${starrocks_base_url}"
    username = "${starrocks_username}"
    password = "${starrocks_password}"
    database = "${starrocks_database}"
    table = "xchg_meas_site"
    batch_max_rows = 5000
    starrocks.config = {
      format = "JSON"
      strip_outer_array = true
    }
  }
}
