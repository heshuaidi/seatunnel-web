env {
  job.mode = "BATCH"
  parallelism = 1
}

source {
  Jdbc {
    plugin_output = "order_join_src"

    driver = "oracle.jdbc.OracleDriver"
    url = "jdbc:oracle:thin:@//oracle.lab:1521/FREEPDB1"
    user = "ST"
    password = "st"

    query = """
      SELECT
        h.ORDER_ID AS order_id,
        h.CUSTOMER_ID AS customer_id,
        c.CUSTOMER_NAME AS customer_name,
        h.ORDER_STATUS AS order_status,
        i.ITEM_ID AS item_id,
        i.PRODUCT_CODE AS product_code,
        i.QTY AS qty,
        i.UNIT_PRICE AS unit_price,
        i.QTY * i.UNIT_PRICE AS item_amount,
        h.CREATE_TIME AS order_create_time,
        GREATEST(
          NVL(h.UPDATE_TIME, TIMESTAMP '1970-01-01 00:00:00'),
          NVL(i.UPDATE_TIME, TIMESTAMP '1970-01-01 00:00:00'),
          NVL(c.UPDATE_TIME, TIMESTAMP '1970-01-01 00:00:00')
        ) AS biz_update_time
      FROM ST_ORDER_HEADER h
      JOIN ST_ORDER_ITEM i
        ON h.ORDER_ID = i.ORDER_ID
      LEFT JOIN ST_CUSTOMER c
        ON h.CUSTOMER_ID = c.CUSTOMER_ID
      WHERE
        GREATEST(
          NVL(h.UPDATE_TIME, TIMESTAMP '1970-01-01 00:00:00'),
          NVL(i.UPDATE_TIME, TIMESTAMP '1970-01-01 00:00:00'),
          NVL(c.UPDATE_TIME, TIMESTAMP '1970-01-01 00:00:00')
        ) >= TIMESTAMP '2026-06-07 00:00:00'
    """
  }
}

transform {
  DynamicCompile {
    plugin_input = "order_join_src"
    plugin_output = "order_wide_tf"

    compile_language = "GROOVY"
    compile_pattern = "SOURCE_CODE"

    source_code = """
      import org.apache.seatunnel.api.table.catalog.Column
      import org.apache.seatunnel.api.table.catalog.CatalogTable
      import org.apache.seatunnel.api.table.catalog.PhysicalColumn
      import org.apache.seatunnel.api.table.type.BasicType
      import org.apache.seatunnel.api.table.type.SeaTunnelRowAccessor

      class OrderWideGroovyTransform {

        public Column[] getInlineOutputColumns(CatalogTable inputCatalogTable) {
          return new Column[] {
            PhysicalColumn.of("order_id", BasicType.LONG_TYPE, 20L, true, "", ""),
            PhysicalColumn.of("customer_id", BasicType.LONG_TYPE, 20L, true, "", ""),
            PhysicalColumn.of("customer_name", BasicType.STRING_TYPE, 200L, true, "", ""),
            PhysicalColumn.of("order_status", BasicType.STRING_TYPE, 50L, true, "", ""),
            PhysicalColumn.of("item_id", BasicType.LONG_TYPE, 20L, true, "", ""),
            PhysicalColumn.of("product_code", BasicType.STRING_TYPE, 100L, true, "", ""),
            PhysicalColumn.of("qty", BasicType.INT_TYPE, 11L, true, "", ""),
            PhysicalColumn.of("unit_price", BasicType.DOUBLE_TYPE, 18L, true, "", ""),
            PhysicalColumn.of("item_amount", BasicType.DOUBLE_TYPE, 18L, true, "", ""),
            PhysicalColumn.of("order_create_time", BasicType.STRING_TYPE, 30L, true, "", ""),
            PhysicalColumn.of("biz_update_time", BasicType.STRING_TYPE, 30L, true, "", ""),
            PhysicalColumn.of("order_item_key", BasicType.STRING_TYPE, 128L, true, "", ""),
            PhysicalColumn.of("biz_domain", BasicType.STRING_TYPE, 50L, true, "", "")
          }
        }

        public Object[] getInlineOutputFieldValues(SeaTunnelRowAccessor inputRow) {
          Object orderId = inputRow.getField(0)
          Object customerId = inputRow.getField(1)
          Object customerName = inputRow.getField(2)
          Object orderStatus = inputRow.getField(3)
          Object itemId = inputRow.getField(4)
          Object productCode = inputRow.getField(5)
          Object qty = inputRow.getField(6)
          Object unitPrice = inputRow.getField(7)
          Object itemAmount = inputRow.getField(8)
          Object orderCreateTime = inputRow.getField(9)
          Object bizUpdateTime = inputRow.getField(10)

          Object orderItemKey = null
          if (orderId != null && itemId != null) {
            orderItemKey = orderId.toString() + "_" + itemId.toString()
          }

          return new Object[] {
            orderId,
            customerId,
            customerName,
            orderStatus,
            itemId,
            productCode,
            qty,
            unitPrice,
            itemAmount,
            orderCreateTime == null ? null : orderCreateTime.toString(),
            bizUpdateTime == null ? null : bizUpdateTime.toString(),
            orderItemKey,
            "ORDER_WIDE"
          }
        }
      }
    """
  }
}

sink {
  StarRocks {
    plugin_input = "order_wide_tf"

    nodeUrls = ["starrocks.lab:8040"]
    base-url = "jdbc:mysql://starrocks.lab:9030/"
    username = "st_lab"
    password = "st_lab_pass"

    database = "st_test"
    table = "st_lab_order_wide_sink"

    batch_max_rows = 10

    starrocks.config = {
      format = "JSON"
      strip_outer_array = true
    }
  }
}