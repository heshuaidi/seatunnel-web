worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 200M;

    server {
        listen 80;
        server_name _;
        absolute_redirect off;
        server_name_in_redirect off;
        port_in_redirect off;

        location = /seatunnel-web-ui {
            return 301 /seatunnel-web-ui/;
        }

        location ^~ /seatunnel-web-ui/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri /seatunnel-web-ui/index.html;
        }

        # For local Docker direct access to the frontend container.
        # In company K8s, prefer Ingress routing /seatunnel-web-api/ directly to the API Service.
        location /seatunnel-web-api/ {
            proxy_pass http://seatunnel-web-api/seatunnel-web-api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
