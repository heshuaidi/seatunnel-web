apiVersion: apps/v1
kind: Deployment
metadata:
  name: seatunnel-web-api
  labels:
    app: seatunnel-web-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seatunnel-web-api
  template:
    metadata:
      labels:
        app: seatunnel-web-api
    spec:
      containers:
        - name: seatunnel-web-api
          image: <harbor-host>/<project>/seatunnel-web-api:<tag>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: /seatunnel-web-api
            - name: SPRING_PROFILES_ACTIVE
              value: mysql
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://<mysql-host>:3306/seatunnel_web?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: seatunnel-web-db
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seatunnel-web-db
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: seatunnel-web-api
  labels:
    app: seatunnel-web-api
spec:
  type: ClusterIP
  selector:
    app: seatunnel-web-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
