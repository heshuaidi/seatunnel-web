apiVersion: v1
kind: Secret
metadata:
  name: seatunnel-web-db
  namespace: seatunnel-web
type: Opaque
stringData:
  username: seatunnel_web
  password: change_me
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seatunnel-web-api-config
  namespace: seatunnel-web
data:
  SPRING_DATASOURCE_URL: "jdbc:mysql://mariadb.example.local:3306/seatunnel_web?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"

