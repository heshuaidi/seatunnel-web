apiVersion: apps/v1
kind: Deployment
metadata:
  name: seatunnel-web-ui
  labels:
    app: seatunnel-web-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seatunnel-web-ui
  template:
    metadata:
      labels:
        app: seatunnel-web-ui
    spec:
      containers:
        - name: seatunnel-web-ui
          image: <harbor-host>/<project>/seatunnel-web-ui:<tag>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: seatunnel-web-ui
  labels:
    app: seatunnel-web-ui
spec:
  type: ClusterIP
  selector:
    app: seatunnel-web-ui
  ports:
    - name: http
      port: 80
      targetPort: 80
