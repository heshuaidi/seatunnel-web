env {
  job.mode = "BATCH"
  parallelism = 1
}

source {
  Jdbc {
    plugin_output = "src_header"
    url = "${source_jdbc_url}"
    driver = "${source_jdbc_driver}"
    username = "${source_username}"
    password = "${source_password}"
    query = """
      ${header_source_sql}
    """
  }

  Jdbc {
    plugin_output = "src_site"
    url = "${source_jdbc_url}"
    driver = "${source_jdbc_driver}"
    username = "${source_username}"
    password = "${source_password}"
    query = """
      ${site_source_sql}
    """
  }
}

transform {
  Sql {
    plugin_input = "src_header"
    plugin_output = "valid_header"
    query = """
      SELECT
        '${batch_id}' AS batch_id,
        meas_id,
        '${source_system}' AS source_system,
        source_table,
        lot_id,
        wafer_id,
        product_id,
        step_id,
        tool_id,
        chamber_id,
        recipe_id,
        param_code,
        measure_time,
        update_time,
        CURRENT_TIMESTAMP AS ingest_time
      FROM src_header
      WHERE meas_id IS NOT NULL
        AND update_time IS NOT NULL
    """
  }

  Sql {
    plugin_input = "src_site"
    plugin_output = "valid_site"
    query = """
      SELECT
        '${batch_id}' AS batch_id,
        meas_id,
        site_no,
        die_x,
        die_y,
        site_x,
        site_y,
        value_num,
        spec_low,
        spec_high,
        CASE
          WHEN value_num IS NULL THEN false
          WHEN spec_low IS NOT NULL AND value_num < spec_low THEN true
          WHEN spec_high IS NOT NULL AND value_num > spec_high THEN true
          ELSE false
        END AS is_oos,
        update_time,
        CURRENT_TIMESTAMP AS ingest_time
      FROM src_site
      WHERE meas_id IS NOT NULL
        AND site_no IS NOT NULL
    """
  }

  Sql {
    plugin_input = "src_header"
    plugin_output = "error_header"
    query = """
      SELECT
        '${batch_id}' AS batch_id,
        CONCAT('HEADER_', '${batch_id}', '_', COALESCE(CAST(meas_id AS STRING), 'UNKNOWN')) AS error_id,
        '${source_system}' AS source_system,
        source_table,
        CAST(meas_id AS STRING) AS source_key,
        'HEADER_VALIDATE_ERROR' AS error_type,
        CASE
          WHEN meas_id IS NULL THEN 'MEAS_ID_NULL'
          WHEN update_time IS NULL THEN 'UPDATE_TIME_NULL'
          ELSE 'UNKNOWN_HEADER_ERROR'
        END AS error_reason,
        CAST(meas_id AS STRING) AS raw_payload,
        CURRENT_TIMESTAMP AS created_time
      FROM src_header
      WHERE meas_id IS NULL
         OR update_time IS NULL
    """
  }

  Sql {
    plugin_input = "valid_header"
    plugin_output = "batch_summary"
    query = """
      SELECT
        '${batch_id}' AS batch_id,
        '${task_code}' AS task_code,
        '${source_system}' AS source_system,
        '${batch_start_value}' AS batch_start_value,
        '${batch_end_value}' AS batch_end_value,
        CAST('${batch_start_time}' AS TIMESTAMP) AS batch_start_time,
        CAST('${batch_end_time}' AS TIMESTAMP) AS batch_end_time,
        'RUNNING' AS status,
        COUNT(*) AS source_count,
        COUNT(*) AS header_count,
        CAST(NULL AS BIGINT) AS site_count,
        CAST(NULL AS BIGINT) AS error_count,
        CURRENT_TIMESTAMP AS created_time,
        CURRENT_TIMESTAMP AS updated_time
      FROM valid_header
    """
  }
}

sink {
  StarRocks {
    plugin_input = "batch_summary"
    nodeUrls = [${starrocks_node_urls}]
    base-url = "${starrocks_base_url}"
    username = "${starrocks_username}"
    password = "${starrocks_password}"
    database = "${starrocks_database}"
    table = "xchg_batch"
    batch_max_rows = 1000
    starrocks.config = {
      format = "JSON"
      strip_outer_array = true
    }
  }

  StarRocks {
    plugin_input = "valid_header"
    nodeUrls = [${starrocks_node_urls}]
    base-url = "${starrocks_base_url}"
    username = "${starrocks_username}"
    password = "${starrocks_password}"
    database = "${starrocks_database}"
    table = "xchg_meas_header"
    batch_max_rows = 5000
    starrocks.config = {
      format = "JSON"
      strip_outer_array = true
    }
  }

  StarRocks {
    plugin_input = "valid_site"
    nodeUrls = [${starrocks_node_urls}]
    base-url = "${starrocks_base_url}"
    username = "${starrocks_username}"
    password = "${starrocks_password}"
    database = "${starrocks_database}"
    table = "xchg_meas_site"
    batch_max_rows = 5000
    starrocks.config = {
      format = "JSON"
      strip_outer_array = true
    }
  }

  StarRocks {
    plugin_input = "error_header"
    nodeUrls = [${starrocks_node_urls}]
    base-url = "${starrocks_base_url}"
    username = "${starrocks_username}"
    password = "${starrocks_password}"
    database = "${starrocks_database}"
    table = "xchg_meas_error"
    batch_max_rows = 5000
    starrocks.config = {
      format = "JSON"
      strip_outer_array = true
    }
  }
}
