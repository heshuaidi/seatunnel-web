env {
  job.mode = "BATCH"
  parallelism = 1
}

source {
  Jdbc {
    plugin_output = "xchg_header"
    url = "${starrocks_jdbc_url}"
    driver = "${starrocks_jdbc_driver}"
    username = "${starrocks_username}"
    password = "${starrocks_password}"
    query = """
      /* sync_batch_id=${batch_id}, run_id=${run_id}, task_code=${task_code}, source_system=${source_system} */
      SELECT
        batch_id,
        meas_id,
        source_system,
        source_table,
        lot_id,
        wafer_id,
        product_id,
        step_id,
        tool_id,
        chamber_id,
        recipe_id,
        param_code,
        measure_time,
        update_time,
        ingest_time,
        CURRENT_TIMESTAMP AS publish_time
      FROM ${xchg_header_table}
      WHERE batch_id = '${xchg_batch_id}'
    """
  }

  Jdbc {
    plugin_output = "xchg_site"
    url = "${starrocks_jdbc_url}"
    driver = "${starrocks_jdbc_driver}"
    username = "${starrocks_username}"
    password = "${starrocks_password}"
    query = """
      /* sync_batch_id=${batch_id}, run_id=${run_id}, task_code=${task_code}, source_system=${source_system} */
      SELECT
        batch_id,
        meas_id,
        site_no,
        die_x,
        die_y,
        site_x,
        site_y,
        value_num,
        spec_low,
        spec_high,
        is_oos,
        update_time,
        ingest_time,
        CURRENT_TIMESTAMP AS publish_time
      FROM ${xchg_site_table}
      WHERE batch_id = '${xchg_batch_id}'
    """
  }

  Jdbc {
    plugin_output = "xchg_error"
    url = "${starrocks_jdbc_url}"
    driver = "${starrocks_jdbc_driver}"
    username = "${starrocks_username}"
    password = "${starrocks_password}"
    query = """
      /* sync_batch_id=${batch_id}, run_id=${run_id}, task_code=${task_code}, source_system=${source_system} */
      SELECT
        batch_id,
        error_id,
        source_system,
        source_table,
        source_key,
        error_type,
        error_reason,
        raw_payload,
        created_time,
        CURRENT_TIMESTAMP AS publish_time
      FROM ${xchg_error_table}
      WHERE batch_id = '${xchg_batch_id}'
    """
  }
}

sink {
  StarRocks {
    plugin_input = "xchg_header"
    nodeUrls = [${starrocks_node_urls}]
    base-url = "${starrocks_base_url}"
    username = "${starrocks_username}"
    password = "${starrocks_password}"
    database = "${starrocks_database}"
    table = "${stg_header_table}"
    batch_max_rows = 5000
    starrocks.config = {
      format = "JSON"
      strip_outer_array = true
    }
  }

  StarRocks {
    plugin_input = "xchg_site"
    nodeUrls = [${starrocks_node_urls}]
    base-url = "${starrocks_base_url}"
    username = "${starrocks_username}"
    password = "${starrocks_password}"
    database = "${starrocks_database}"
    table = "${stg_site_table}"
    batch_max_rows = 5000
    starrocks.config = {
      format = "JSON"
      strip_outer_array = true
    }
  }

  StarRocks {
    plugin_input = "xchg_error"
    nodeUrls = [${starrocks_node_urls}]
    base-url = "${starrocks_base_url}"
    username = "${starrocks_username}"
    password = "${starrocks_password}"
    database = "${starrocks_database}"
    table = "${stg_error_table}"
    batch_max_rows = 5000
    starrocks.config = {
      format = "JSON"
      strip_outer_array = true
    }
  }
}
